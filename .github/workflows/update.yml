name: Обновление подборки квартир

on:
  schedule:
    # каждые 2 дня в 07:17 по Москве (04:17 UTC)
    - cron: "17 4 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-flats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать объявления с Циана
        run: python scraper/update.py

      - name: Сохранить изменения
        run: |
          git config user.name "flat-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Обновление подборки $(TZ=Europe/Moscow date +'%d.%m.%Y')"
            git push
          fi
